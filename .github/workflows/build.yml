name: Build Kernel Redwood with KernelSU-Next v3.3.0

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Download Proton-Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

      - name: Clone Kernel Source
        run: |
          # Mengambil source code dari Harukiansyah
          git clone --depth=1 https://github.com/Harukiansyah/scarlet_xiaomi_sm7325_Fork kernel

      - name: Inject KernelSU-Next (v3.3.0)
        run: |
          cd kernel
          # Menjalankan script setup KSU-Next dengan parameter versi 3.3.0
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.3.0

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Scarlet-Builder"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          # CATATAN: Ubah "vendor/redwood_defconfig" jika nama defconfig di repo berbeda. 
          # Terkadang namanya "vendor/sm7325-perf_defconfig" atau "vendor/xiaomi/redwood.config"
          make O=out vendor/redwood_defconfig
          
          # Proses Kompilasi
          make -j$(nproc --all) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Pack with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          # Salin Image kernel yang sudah jadi ke dalam folder AnyKernel3
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          
          cd AnyKernel3
          # Nonaktifkan device check agar aman di-flash tanpa gagal (pastikan kamu hanya flash di Poco X5 Pro 5G)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          
          # Membungkusnya menjadi file ZIP yang siap flash via TWRP/KernelSU
          zip -r9 ../ShinjiKernel-Redwood-KSUN.zip *

      - name: Upload Kernel Artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: ShinjiKernel-Redwood-KSUNext
          path: ShinjiKernel-Redwood-KSUN.zip
          
